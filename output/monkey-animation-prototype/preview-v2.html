<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Monkey animation prototype</title>
<style>body{background:#0d1724;color:#f5e4c2;font:16px system-ui;margin:32px}h1{margin-bottom:8px}p{color:#aebfcd}button,select{font:inherit;padding:8px;margin:8px;background:#263c4b;color:white;border:1px solid #788a91;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}article{text-align:center;background:#101827;border:1px solid #344958;border-radius:8px}h2{font-size:16px}canvas{width:100%;image-rendering:pixelated}img{max-width:100%;image-rendering:pixelated}a{color:#f4cb7a}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}</style>
<h1>Five monkeys · smoother prototype</h1><p>Double-jump roll and slap studies. Grab arms are separate components below.</p>
<button id="play">Pause</button><button id="step">Next frame</button><select id="action" aria-label="Animation"><option value="0">Double-jump roll</option><option value="4">Slap attack</option></select><select id="speed" aria-label="Frames per second"><option value="4">4 FPS</option><option value="8" selected>8 FPS</option><option value="12">12 FPS</option></select>
<div class="grid" id="grid"></div><p>Four poses per action. Early visual prototype: alignment and roll in-between poses still need cleanup.</p>
<h2>Separate long grab arms</h2><img src="grab-arms-v2.png" alt="Five separate long grab arms matching the five monkey palettes"><p><a href="monkeys-smooth-v2.png">Open full animation sheet</a> · <a href="grab-arms-v2.png">Open arm sheet</a></p>
<script>
const names=['Common monkey','Chimpanzee','Gorilla','Orangutan','Gibbon'],ys=[0,220,407,603,794,1024],cs=[];let frame=0,playing=true,last=0;
for(const name of names){const a=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=name;c.width=192;c.height=230;a.append(h,c);document.getElementById('grid').append(a);cs.push(c)}
const img=new Image();img.src='monkeys-smooth-v2.png';
function draw(){cs.forEach((c,r)=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle='#101827';x.fillRect(0,0,192,230);const col=Number(document.getElementById('action').value)+frame,h=ys[r+1]-ys[r];x.drawImage(img,col*192,ys[r],192,h,0,Math.round((230-h)/2),192,h)})}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play'};
document.getElementById('step').onclick=()=>{playing=false;document.getElementById('play').textContent='Play';frame=(frame+1)%4;draw()};
document.getElementById('action').onchange=()=>{frame=0;draw()};
img.onload=()=>{draw();requestAnimationFrame(function loop(t){if(playing&&t-last>1000/Number(document.getElementById('speed').value)){frame=(frame+1)%4;draw();last=t}requestAnimationFrame(loop)})};
</script></html>
